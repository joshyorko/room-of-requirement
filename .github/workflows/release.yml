name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      source: ${{ steps.release.outputs.sha }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  images:
    name: Verify and publish released source
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        variant: [ubuntu-noble, debian-trixie, wolfi]
    uses: ./.github/workflows/build-image.yml
    with:
      variant: ${{ matrix.variant }}
      publish: true
      source_sha: ${{ needs.release-please.outputs.source }}
      release_version: ${{ needs.release-please.outputs.version }}
      fail_on_critical: true
    secrets: inherit
