name: Build Templates

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - '.node-version'
      - '.github/workflows/build-image.yml'
      - '.github/scripts/build_toolchain.py'
      - '.github/scripts/node_inventory.py'
      - '.github/workflows/build-templates.yml'
      - '.github/scripts/template_smoke.py'
      - '.github/scripts/publish_template.py'
      - 'tests/ci-template-test.py'
  pull_request:
    branches: [main]
    paths:
      - 'templates/**'
      - '.node-version'
      - '.github/workflows/build-image.yml'
      - '.github/scripts/build_toolchain.py'
      - '.github/scripts/node_inventory.py'
      - '.github/workflows/build-templates.yml'
      - '.github/scripts/template_smoke.py'
      - '.github/scripts/publish_template.py'
      - 'tests/ci-template-test.py'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated starter from current main
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  starter:
    runs-on: ubuntu-latest
    outputs:
      variant: ${{ steps.metadata.outputs.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the starter's supported target variant
        id: metadata
        run: python3 .github/scripts/template_smoke.py --metadata

  validate:
    name: Build candidate and apply/start the starter
    needs: starter
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      actions: read
    uses: ./.github/workflows/build-image.yml
    with:
      variant: ${{ needs.starter.outputs.variant }}
      publish: false
      validate_template: true
      fail_on_critical: true
    secrets: inherit

  publish:
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ror-template-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .node-version
      - run: python3 .github/scripts/build_toolchain.py --evidence "$RUNNER_TEMP/template-toolchain"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: template-toolchain-${{ github.run_attempt }}
          path: ${{ runner.temp }}/template-toolchain/
          if-no-files-found: error
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify source freshness and publish the tested template payload
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: python3 .github/scripts/publish_template.py
