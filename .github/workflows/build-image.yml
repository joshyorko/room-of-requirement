name: Verify Image Candidate

on:
  workflow_call:
    inputs:
      variant:
        type: string
        default: ubuntu-noble
      publish:
        description: Publish a unique candidate; production aliases require all gates
        type: boolean
        default: false
      source_sha:
        description: Exact source commit (released tag commit for release callers)
        type: string
        default: ''
      release_version:
        description: Stable version without v; Ubuntu owns bare version aliases
        type: string
        default: ''
      refresh:
        description: Re-run mutable dependency installation and pull base images
        type: boolean
        default: false
      fail_on_critical:
        description: Enforce Critical CVEs with fixes; false forbids production promotion
        type: boolean
        default: true
      validate_template:
        type: boolean
        default: false
    outputs:
      digest:
        description: Immutable candidate digest (empty for local PR builds)
        value: ${{ jobs.verify.outputs.digest }}
  workflow_dispatch:
    inputs:
      variant:
        type: choice
        default: ubuntu-noble
        options: [ubuntu-noble, debian-trixie, wolfi]
      publish:
        description: Publish a candidate (branch candidates never promote production aliases)
        type: boolean
        default: false
      refresh:
        description: Refresh mutable dependencies
        type: boolean
        default: false
      release_version:
        description: Existing stable release version without v; dispatch its exact tag ref
        type: string
        default: ''
      fail_on_critical:
        description: Enforce Critical CVEs with fixes; false forbids production promotion
        type: boolean
        default: true

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.0.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
      - name: Install pinned CLI for command-generation regressions
        run: npm install -g @devcontainers/cli@0.89.0
      - name: Install runtime regression prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3-venv git sudo just
          python3 -m venv "$RUNNER_TEMP/regression-python"
          "$RUNNER_TEMP/regression-python/bin/pip" install PyYAML==6.0.3
          echo "$RUNNER_TEMP/regression-python/bin" >> "$GITHUB_PATH"
          curl --fail --show-error --location --retry 3 \
            https://github.com/jdx/mise/releases/download/v2026.9.1/mise-v2026.9.1-linux-x64.tar.gz \
            --output "$RUNNER_TEMP/mise.tar.gz"
          echo "063dda9149ab6be53da877c2d176afe0eac68e64cf8ca295bd0528720701c65d  $RUNNER_TEMP/mise.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mise.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/mise/bin" >> "$GITHUB_PATH"
      - name: CI policy and execution regressions
        run: .github/scripts/regressions.sh
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: src/${{ inputs.variant }}/.devcontainer/Dockerfile
          failure-threshold: error
          format: sarif
          output-file: hadolint.sarif
          no-fail: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: hadolint-${{ inputs.variant }}-${{ github.run_attempt }}
          path: hadolint.sarif
          if-no-files-found: error
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        if: always() && github.event_name != 'pull_request' && hashFiles('hadolint.sarif') != ''
        with:
          sarif_file: hadolint.sarif
          category: hadolint-${{ inputs.variant }}

  verify:
    name: Build once, runtime test, SBOM and scan
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.build.outputs.image }}
      publish: ${{ steps.build.outputs.publish }}
      enforce: ${{ steps.build.outputs.enforce }}
      subject_digest: ${{ steps.subject.outputs.subject_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
      - name: Install feature-aware builder
        run: npm install -g @devcontainers/cli@0.89.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        if: inputs.publish && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build local image or unique registry candidate
        id: build
        env:
          REQUEST: >-
            {"event":${{ toJSON(github.event_name) }},"ref":${{ toJSON(github.ref) }},
            "source":${{ toJSON(inputs.source_sha || github.sha) }},"repository":${{ toJSON(github.repository) }},
            "variant":${{ toJSON(inputs.variant) }},"run_id":"${{ github.run_id }}","run_attempt":"${{ github.run_attempt }}",
            "publish":${{ toJSON(inputs.publish) }},"enforce":${{ toJSON(inputs.fail_on_critical) }},
            "refresh":${{ toJSON(inputs.refresh) }},"release_version":${{ toJSON(inputs.release_version || '') }}}
        run: .github/scripts/build_image.py
      - name: Docker and Wolfi rootless Podman runtime contracts
        env:
          TEST_IMAGE: ${{ steps.build.outputs.test_image }}
          VARIANT: ${{ inputs.variant }}
        run: .github/scripts/runtime-smoke.sh "$TEST_IMAGE" "$VARIANT"
      - name: Apply and start the starter template with the candidate
        if: inputs.validate_template
        env:
          TEST_IMAGE: ${{ steps.build.outputs.test_image }}
          VARIANT: ${{ inputs.variant }}
        run: .github/scripts/template_smoke.py
      - name: Generate SPDX SBOM from the tested image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          image: ${{ steps.build.outputs.scan_image }}
          syft-version: v1.51.1
          format: spdx-json
          output-file: ${{ runner.temp }}/image-evidence/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Validate SPDX output, including on PRs
        run: .github/scripts/attest_image.py --validate-only
      - name: Scan tested image with Grype
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          image: ${{ steps.build.outputs.scan_image }}
          grype-version: v0.118.0
          config: .grype.yaml
          # Severity is enforced by the JSON gate below. Scanner errors remain fatal.
          fail-build: false
          only-fixed: false
          output-format: json
          output-file: ${{ runner.temp }}/image-evidence/grype.json
      - name: Validate scan output and enforce Critical with fixes
        if: always() && steps.build.outcome == 'success'
        env:
          SCANNER_OUTCOME: ${{ steps.grype.outcome }}
          ENFORCE: ${{ toJSON(inputs.fail_on_critical) }}
        run: |
          python3 .github/scripts/scan_report.py "$RUNNER_TEMP/image-evidence/grype.json" \
            --scanner-outcome "$SCANNER_OUTCOME" --enforce "$ENFORCE" \
            --expected-identity "$RUNNER_TEMP/image-evidence/identity.json" \
            --summary "$RUNNER_TEMP/image-evidence/scan-summary.json" \
            --sarif "$RUNNER_TEMP/image-evidence/grype-critical.sarif"
      - name: Upload critical findings
        if: always() && github.event_name != 'pull_request' && steps.grype.outcome == 'success'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: ${{ runner.temp }}/image-evidence/grype-critical.sarif
          category: grype-${{ inputs.variant }}
      - name: Preserve build, SBOM and scan evidence even when the gate fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: image-evidence-${{ inputs.variant }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-evidence/
          if-no-files-found: error
      - name: Bind successful runtime, SBOM and scan verification to the candidate
        id: subject
        run: python3 .github/scripts/image_identity.py

  attest:
    name: Sign digest and attest its SBOM
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      subject_digest: ${{ steps.attest.outputs.subject_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: image-evidence-${{ inputs.variant }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-evidence
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.0.5
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign once and attest the SPDX predicate on the same digest
        id: attest
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          DIGEST: ${{ needs.verify.outputs.digest }}
        run: .github/scripts/attest_image.py
      - name: Preserve the signed checkout and release source context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-context-${{ inputs.variant }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-evidence/build-context.json
          if-no-files-found: error

  generate-provenance:
    name: SLSA provenance for the verified digest
    needs: [verify, attest]
    if: needs.verify.outputs.publish == 'true'
    permissions:
      actions: read
      id-token: write
      packages: write
    # SLSA's verifier requires the generator's semantic version ref.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.verify.outputs.image }}
      digest: ${{ needs.verify.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  provenance:
    name: Verify provenance claims for the candidate digest
    needs: [verify, generate-provenance]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      subject_digest: ${{ steps.subject.outputs.subject_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.0.5
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify signed subject claims before recording the gate
        id: subject
        env:
          GENERATOR_RESULT: ${{ needs.generate-provenance.result }}
          IMAGE: ${{ needs.verify.outputs.image }}
          DIGEST: ${{ needs.verify.outputs.digest }}
        run: python3 .github/scripts/verify_provenance.py

  promote:
    name: Promote verified digest
    needs: [verify, attest, provenance]
    if: >-
      needs.verify.outputs.publish == 'true' && needs.verify.outputs.enforce == 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    # Shared across every caller. Variants own disjoint aliases, including version tags.
    concurrency:
      group: ror-image-promotion-${{ inputs.variant }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: image-evidence-${{ inputs.variant }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-evidence
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate all gates and fresh source, then copy the digest without rebuilding
        env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/promote_image.py "$RUNNER_TEMP/image-evidence/context.json"
