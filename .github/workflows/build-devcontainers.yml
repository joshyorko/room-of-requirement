name: Build Devcontainers

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - '.devcontainer/**'
      - '.github/workflows/build-image.yml'
      - '.github/workflows/build-devcontainers.yml'
      - '.github/scripts/**'
      - 'tests/ci-*'
      - 'tests/ci-*/**'
      - '.grype.yaml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.devcontainer/**'
      - '.github/workflows/build-image.yml'
      - '.github/workflows/build-devcontainers.yml'
      - '.github/scripts/**'
      - 'tests/ci-*'
      - 'tests/ci-*/**'
      - '.grype.yaml'
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish candidates (production promotion requires current main)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
  actions: read

jobs:
  images:
    strategy:
      fail-fast: false
      matrix:
        variant: [ubuntu-noble, debian-trixie, wolfi]
    uses: ./.github/workflows/build-image.yml
    with:
      variant: ${{ matrix.variant }}
      publish: ${{ github.event_name == 'push' || github.event_name == 'schedule' || inputs.publish == true }}
      refresh: ${{ github.event_name == 'schedule' }}
      fail_on_critical: true
    secrets: inherit
