  # ============================================================================
  # Go advisories observed in Build Devcontainers run 38239680002 (2026-10-12).
  # GO-2026-6604 concerns Windows junctions; builds target linux/amd64.
  # https://vuln.go.dev/ID/GO-2026-6604.json
  # GO-2026-6612 / CVE-2026-78663 remain in published container tools.
  # https://vuln.go.dev/ID/GO-2026-6612.json
  # Upstream Compose v5.6.0 and Buildx v0.38.0 still embed affected Go code.
  # Wolfi public feeds lack buildah 1.45.1-r3, skopeo 1.24.1-r3, and
  # podman-6.0 6.0.2-r11, despite the scan database reporting those fixes.
  # HTTP/2 exceptions accept residual risk; they do not patch the binaries.
  # Remove each exception when its upstream binary/package is rebuilt.
  # Exact versions and locations leave other Critical-with-fix findings fatal.
