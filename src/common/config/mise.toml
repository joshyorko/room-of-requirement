# mise Configuration for Room of Requirement
# Shared settings; language profiles are installed explicitly with
# `ujust runtime-defaults` or declared by each project.

# ============================================================================
# MISE SETTINGS
# ============================================================================
[settings]
# Project hydration installs declared tools. Shell startup does not download
# undeclared global runtimes.
auto_install = false

# Show status messages
quiet = false

# Use pre-built Ruby binaries; never compile from source in postcreate
ruby.compile = false

# ============================================================================
# ENVIRONMENT
# ============================================================================
[env]
# Precedence: mise shims > Homebrew > standard system paths
_.path = [
  "/usr/local/share/mise/shims",
  "/home/linuxbrew/.linuxbrew/bin",
  "/home/linuxbrew/.linuxbrew/sbin"
]

# ============================================================================
# TOOL ALIASES (disabled - mise alias syntax is in flux)
# ============================================================================
# Aliases are optional convenience shortcuts. Use explicit versions instead:
#   mise use node@20    (instead of node@lts)
#   mise use python@3.15.0
#   mise use go@1.23.0
